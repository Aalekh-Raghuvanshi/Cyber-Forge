rules:
  - id: benchmark-python-sqli-concatenation
    languages: [python]
    severity: ERROR
    message: "Possible SQL injection: untrusted input is concatenated into a SQL query."
    metadata:
      cwe: "CWE-89"
      category: security
      confidence: high
    pattern-either:
      - pattern: $DB.execute($LEFT + $INPUT + $RIGHT)
      - pattern: $DB.execute($LEFT + $INPUT)
      - pattern: $DB.execute(f"...{$INPUT}...")
      - pattern-regex: 'execute\("SELECT [^\n]*\+\s*[A-Za-z_][A-Za-z0-9_]*\s*\+'

  - id: benchmark-python-reflected-xss
    languages: [python]
    severity: ERROR
    message: "Possible reflected XSS: untrusted input is interpolated into an HTML response."
    metadata:
      cwe: "CWE-79"
      category: security
      confidence: high
    pattern-either:
      - pattern: Response(f"...{$INPUT}...", ...)
      - pattern: Response($LEFT + $INPUT + $RIGHT, ...)
      - pattern: return f"...{$INPUT}..."
      - pattern-regex: 'Response\(f"<main>[^\n]*\{[A-Za-z_][A-Za-z0-9_]*\}[^\n]*mimetype="text/html"'

  - id: benchmark-python-path-traversal
    languages: [python]
    severity: ERROR
    message: "Possible path traversal: user-controlled path is passed to open() without containment validation."
    metadata:
      cwe: "CWE-22"
      category: security
      confidence: high
    pattern-either:
      - pattern: open(os.path.join($BASE, $USER_PATH), ...)
      - pattern-regex: 'open\(os\.path\.join\(FILES_DIR,\s*[A-Za-z_][A-Za-z0-9_]*\),\s*"r"'

  - id: benchmark-python-open-redirect
    languages: [python]
    severity: WARNING
    message: "Possible open redirect: redirect target comes directly from a request parameter."
    metadata:
      cwe: "CWE-601"
      category: security
      confidence: medium
    pattern-either:
      - pattern: redirect(request.args.get(...))
      - pattern-regex: 'redirect\(request\.args\.get\("[A-Za-z_][A-Za-z0-9_]*",\s*"/"\)\)'

  - id: benchmark-python-command-injection
    languages: [python]
    severity: ERROR
    message: "Possible OS command injection: shell=True is used with a dynamically assembled command."
    metadata:
      cwe: "CWE-78"
      category: security
      confidence: high
    pattern-either:
      - patterns:
          - pattern: subprocess.run($COMMAND, shell=True, ...)
          - metavariable-pattern:
              metavariable: $COMMAND
              pattern-either:
                - pattern: $LEFT + $RIGHT
                - pattern: f"...{$INPUT}..."
      - pattern-regex: 'subprocess\.run\("printf [^"\n]*"\s*\+\s*[A-Za-z_]\w*,\s*shell=True'
